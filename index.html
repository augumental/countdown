<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050505;
    overflow:hidden;
}

.background{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,0,100,.15), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0,150,255,.15), transparent 30%),
        linear-gradient(135deg,#050505,#0d0d0d);
    filter:blur(20px);
}

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:min(1100px,95%);
}

.logo{
    color:#fff;
    font-size:4rem;
    font-weight:800;
    letter-spacing:-3px;
    margin-bottom:12px;
}

.subtitle{
    color:#9ca3af;
    margin-bottom:50px;
    font-size:1rem;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    width:180px;
    height:180px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border-radius:28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:.3s ease;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.18);
}

.number{
    font-size:4rem;
    font-weight:800;
    color:white;
    line-height:1;

.label{
    margin-top:12px;

    text-transform:uppercase;
    letter-spacing:2px;
    font-size:.8rem;
}

.popup-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup{
    background:#111;
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:50px;
    text-align:center;
    color:white;
    backdrop-filter:blur(20px);
    box-shadow:0 0 60px rgba(255,255,255,.08);

</head>
<body>

<div class="background"></div>

<div class="container">
    <div class="logo">???</div>
    <div class="subtitle">Launching June 14, 2026 • 1:00 PM Eastern Time</div>

    <div class="countdown">
        <div class="card">
            <div class="number" id="days">00</div>
            <div class="label">Days</div>
        </div>

        <div class="card">
            <div class="number" id="hours">00</div>
            <div class="label">Hours</div>
        </div>

        <div class="card">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>

        <div class="card">
            <div class="number" id="seconds">00</div>
            <div class="label">Seconds</div>
        </div>
    </div>
</div>

<div class="popup-overlay" id="popup">
    <div class="popup">
        <h1>🚀 eyecoin.site out now</h1>
        <p>Redirecting to the official website...</p>
    </div>
</div>

<script>
const targetDate = new Date("2026-06-14T13:00:00-04:00").getTime();
let launched = false;

function updateCountdown() {
    const now = Date.now();
    const distance = targetDate - now;

    if (distance <= 0) {

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";

        if (!launched) {
            launched = true;

            document.querySelector(".subtitle").textContent =
                "EyeCoin has officially launched.";

            document.getElementById("popup").style.display = "flex";

            setTimeout(() => {
                window.location.href = "https://eyecoin.site";
            }, 3000);
        }

        return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );
    const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
    );
    const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
    );

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
